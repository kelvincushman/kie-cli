name: Refresh Kie API, Academy, and model evidence

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install generators
        run: |
          python -m pip install -r research/requirements.txt
          go install github.com/mvanhorn/cli-printing-press/v4/cmd/cli-printing-press@v4.30.1
      - name: Rebuild API, Academy methods, and model evidence
        run: scripts/weekly-refresh.sh
      - name: Open a draft refresh PR when Kie changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "Kie contracts, Academy methods, and ranking evidence have not changed."
            exit 0
          fi
          branch="automation/kie-api-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Keep the media factory aligned with current public evidence

          Constraint: Kie contracts come from official Kie docs; Academy output stores public metadata and original adaptations only; rankings preserve external source scores without combining them
          Confidence: high
          Scope-risk: moderate
          Directive: Preserve copyright boundaries, source provenance, task-specific ranks, and embedded per-model schemas on future refreshes
          Tested: Academy lesson URL verification; research unit tests; go test ./...; go vet ./...; make build-all
          Not-tested: paid live generations require a maintainer-owned Kie API key"
          git push --set-upstream origin "$branch"
          gh pr create --draft \
            --title "chore: refresh media contracts and production evidence" \
            --body "Automated weekly refresh of official Kie API/model contracts, the public Academy lesson-method map, and task-specific external model evidence. Academy output contains links, factual metadata, and original Kie-native abstractions—not copied lesson prose or prompts. No paid generation was submitted."
