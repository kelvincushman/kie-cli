name: Refresh Kie API

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install generators
        run: |
          python -m pip install -r research/requirements.txt
          go install github.com/mvanhorn/cli-printing-press/v4/cmd/cli-printing-press@v4.30.1
      - name: Rebuild complete API and model contracts
        run: scripts/weekly-refresh.sh
      - name: Open a draft refresh PR when Kie changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "Kie documentation has not changed."
            exit 0
          fi
          branch="automation/kie-api-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Keep the printed CLI aligned with Kie.ai's live contract

Constraint: Generated from the official Kie documentation index with CLI Printing Press 4.30.1
Confidence: high
Scope-risk: moderate
Directive: Preserve the embedded per-model schemas and local media-factory patches on future reprints
Tested: research unit tests; go test ./...; go vet ./...; make build-all
Not-tested: paid live generations require a maintainer-owned Kie API key"
          git push --set-upstream origin "$branch"
          gh pr create --draft \
            --title "chore: refresh complete Kie API contracts" \
            --body "Automated weekly refresh from Kie.ai's official documentation index. Includes the merged OpenAPI, full per-model input/settings registry, generated CLI/MCP changes, coverage evidence, and fresh tests. No paid generation was submitted."
